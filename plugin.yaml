name: nox-plugin-threat-enrich
version: 0.3.0
track: intelligence
description: Attaches CWE, OWASP Top 10 and MITRE ATT&CK context to the findings a scan produced
tools:
  # Post-scan: nox hands this tool the completed scan's findings and it attaches
  # threat-intelligence context keyed on each finding's CWE. It emits
  # enrichments keyed by finding fingerprint, never findings of its own.
  - name: enrich
    description: Attach OWASP, MITRE ATT&CK and remediation context to each finding from the completed scan
    requires_scan_context: true
